version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    # Keeps the container running in the background
    command: sleep infinity
    environment:
      - DATABASE_URL=postgres://devuser:devpass@db:5432/devdb
      - PGHOST=db
      - PGUSER=devuser
      - PGPASSWORD=devpass
      - PGDATABASE=devdb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposes Postgres to your local host machine if needed
      - "3002:5432"

volumes:
  postgres-data: